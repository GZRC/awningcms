name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh scripts/*.sh infra/postgres-init/*.sh
      - run: sudo python3 -m unittest tests/test_install.py
  end-to-end:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-local.sh
