# AwningCMS: Caddy (HTTPS), the application and PostgreSQL.
# Settings come from infra/.env, written by install.sh. Secrets live in
# private/ and never enter the image.
name: ${COMPOSE_PROJECT_NAME:-awningcms}
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy run --config /etc/caddy/${CADDYFILE:-Caddyfile} --adapter caddyfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST is missing from infra/.env}
      SITE_HOST: ${SITE_HOST:?SITE_HOST is missing from infra/.env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
  app:
    image: ${AWNINGCMS_IMAGE:-awningcms:latest}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is missing from infra/.env}
      PRIMARY_SITE_ORIGIN: ${PRIMARY_SITE_ORIGIN:?PRIMARY_SITE_ORIGIN is missing from infra/.env}
      VPS_PUBLIC_IPS: ${PUBLIC_IPS:-}
      PGHOST: postgres
      PGDATABASE: cms
      PGUSER: cms_app
      PGPASSWORD_FILE: /run/secrets/app_db_password
      SETUP_TOKEN_FILE: /run/secrets/setup_token
    secrets:
      - app_db_password
      - setup_token
    networks:
      - default
      - database
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1
secrets:
  db_password:
    file: ../private/db-password.secret
  app_db_password:
    file: ../private/app-db-password.secret
  setup_token:
    file: ../private/setup-token.secret
networks:
  database:
    internal: true
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
